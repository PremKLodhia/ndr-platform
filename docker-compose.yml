version: '3.8'

services:
  suricata:
    image: jasonish/suricata:latest
    container_name: ndr-suricata
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    volumes:
      - ./data/pcaps:/pcaps:ro
      - ./suricata_logs:/var/log/suricata
    restart: unless-stopped

  # Placeholder for Wazuh / ELK Stack visibility container
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: ndr-wazuh-manager
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
    restart: unless-stopped
